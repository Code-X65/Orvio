name: Backend CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://orvio:orvio@127.0.0.1:5432/orvio?schema=public
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: orvio
          POSTGRES_USER: orvio
          POSTGRES_PASSWORD: orvio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orvio -d orvio"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - run: pnpm prisma:validate
      - run: pnpm prisma:migrate:deploy
      - run: pnpm exec prisma migrate status
      - run: pnpm prisma:seed && pnpm prisma:seed
      - run: pnpm lint
      - run: pnpm typecheck
      - run: RUN_TESTCONTAINERS=true pnpm test
      - run: pnpm build
