services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orvio
      POSTGRES_USER: orvio
      POSTGRES_PASSWORD: orvio
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orvio -d orvio"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
